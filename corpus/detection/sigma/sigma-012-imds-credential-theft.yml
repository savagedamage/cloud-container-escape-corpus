title: Cloud Instance Metadata (IMDS) Credential Theft
id: 1c0f5c0e-0f0b-4b3c-8a1d-000000000012
status: stable
description: Detects container processes reaching for the cloud instance metadata service credential surface (169.254.169.254 / fd00:ec2::254, /latest/meta-data/iam/security-credentials/, IMDSv2 token endpoint) — node role theft from a workload (CE-011).
references:
  - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-metadata.html
  - https://attack.mitre.org/techniques/T1552/005/
author: cloud-container-escape-corpus
date: 2026-09-20
tags:
  - attack.credential-access
  - attack.t1552.005
  - attack.t1078.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_imds_endpoint:
    CommandLine|contains:
      - '169.254.169.254'
      - 'fd00:ec2::254'
  selection_imds_paths:
    CommandLine|contains:
      - '/latest/meta-data/'
      - '/latest/api/token'
      - '/latest/user-data'
      - 'iam/security-credentials'
      - 'X-aws-ec2-metadata-token'
  condition: selection_imds_endpoint or selection_imds_paths
falsepositives:
  - Node agents, CNI plugins, and cloud-init style tooling that legitimately query instance metadata
  - Kubernetes cloud-controller components reading instance identity during cluster bootstrap
level: high
