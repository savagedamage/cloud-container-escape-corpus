title: Kernel Module Load
id: 1c0f5c0e-0f0b-4b3c-8a1d-000000000007
status: stable
description: Detects kernel module loading via insmod/modprobe from containers — CAP_SYS_MODULE abuse (CE-010).
references:
  - https://man7.org/linux/man-pages/man7/capabilities.7.html
author: cloud-container-escape-corpus
date: 2026-09-16
tags:
  - attack.t1611
  - attack.t1068
logsource:
  category: process_creation
  product: linux
detection:
  selection_insmod:
    Image|endswith: '/insmod'
  selection_modprobe:
    Image|endswith: '/modprobe'
  condition: selection_insmod or selection_modprobe
falsepositives:
  - Legitimate host kernel module management
level: high
