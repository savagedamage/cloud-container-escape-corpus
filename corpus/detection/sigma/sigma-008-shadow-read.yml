title: Shadow File Read (DAC_OVERRIDE)
id: 1c0f5c0e-0f0b-4b3c-8a1d-000000000008
status: stable
description: Detects reads of /etc/shadow from containers — credential harvesting via CAP_DAC_OVERRIDE or host mounts (CE-007, CE-010).
references:
  - https://man7.org/linux/man-pages/man7/capabilities.7.html
author: cloud-container-escape-corpus
date: 2026-09-16
tags:
  - attack.t1005
  - attack.t1611
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
      - 'cat /etc/shadow'
      - 'cat /host/etc/shadow'
      - 'cp /etc/shadow'
  condition: selection
falsepositives:
  - Host-side PAM/authentication tooling reading shadow legitimately
level: high
