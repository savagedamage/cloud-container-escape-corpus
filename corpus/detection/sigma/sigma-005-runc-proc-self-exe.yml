title: runc /proc/self/exe Overwrite Attempt
id: 1c0f5c0e-0f0b-4b3c-8a1d-000000000005
status: stable
description: Detects container processes opening /proc/self/exe for writing — the CVE-2019-5736 runc overwrite primitive (CE-005).
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2019-5736
author: cloud-container-escape-corpus
date: 2026-09-16
tags:
  - attack.t1611
  - attack.t1190
logsource:
  category: file_event
  product: linux
detection:
  selection:
    TargetFilename: '/proc/self/exe'
  condition: selection
falsepositives:
  - Unusual; legitimate processes do not write to /proc/self/exe
level: critical
