title: nsenter or setns Namespace Join
id: 1c0f5c0e-0f0b-4b3c-8a1d-000000000003
status: stable
description: Detects nsenter/setns usage inside containers — joining host namespaces (CE-007, CE-009).
references:
  - https://man7.org/linux/man-pages/man7/namespaces.7.html
author: cloud-container-escape-corpus
date: 2026-09-16
tags:
  - attack.t1611
logsource:
  category: process_creation
  product: linux
detection:
  selection_nsenter:
    Image|endswith: '/nsenter'
  selection_target_one:
    Image|endswith: '/nsenter'
    CommandLine|contains: '-t 1'
  selection_setns:
    Image|endswith:
      - '/python3'
      - '/python'
    CommandLine|contains: 'setns'
  condition: selection_nsenter or selection_target_one or selection_setns
falsepositives:
  - Host administrators legitimately using nsenter for debugging
level: high
