# Sensitive host path mount — CE-007
- rule: Sensitive Host Path Mount
  desc: Detect mounts of sensitive host paths from containers.
  condition: >
    evt.type = mount and container.id != host and
    (evt.arg.name startswith "/host" or evt.arg.name startswith "/hostfs" or
     (evt.arg.name startswith "/proc" and evt.arg.name != "/proc") or
     (evt.arg.name startswith "/sys" and evt.arg.name != "/sys"))
  output: sensitive mount (path=%evt.arg.name proc=%proc.name container=%container.name)
  priority: WARNING
  tags: [container, escape, hostpath, mitre_t1611]
