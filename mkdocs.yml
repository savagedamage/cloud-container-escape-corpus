site_name: Cloud / Container Escape Corpus
site_description: Container and cloud escape research — taxonomy, side channels, detection rules and triage tooling.
site_url: https://savagedamage.github.io/cloud-container-escape-corpus/
repo_url: https://github.com/savagedamage/cloud-container-escape-corpus
repo_name: savagedamage/cloud-container-escape-corpus
edit_uri: ""

# docs/ is GENERATED from the canonical repo files by scripts/build_docs.py —
# never edit a page there, edit the source (README.md, corpus/**, VERIFICATION.md).
# `nav:` is intentionally omitted: MkDocs derives it from the tree, so the
# navigation cannot drift from the pages that exist.
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/savagedamage
