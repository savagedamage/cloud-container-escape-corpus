name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install .[dev] "fastmcp>=2.0"
      - name: Lint
        run: ruff check .
      - name: Unit tests (80% coverage floor)
        run: python -m pytest tests/ -v --cov=escape_corpus --cov-report=term-missing
      - name: Sigma rules are engine-valid
        run: sigma check corpus/detection/sigma/
      - name: Corpus consistency
        run: escape-corpus validate
      - name: Schemas parse
        run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('schemas/*.schema.json')]; print('schemas OK')"
      - name: CLI smoke test
        run: |
          escape-corpus --version
          escape-corpus techniques --id CE-001 | head -3
          escape-corpus rules --technique CE-007 | head -3
          escape-corpus side-channels --id SC-001 | head -2
          escape-corpus schemas
      - name: Verification script (offline checks)
        run: bash scripts/verify.sh

  docs:
    # The docs site is generated from the canonical files, so this catches
    # generator rot (a link to a file that no longer exists fails --strict).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install mkdocs-material PyYAML
      - name: Assemble and build the site
        run: |
          python3 scripts/build_docs.py
          mkdocs build --strict

  live-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Runtime baseline against a real container
        run: |
          docker run -d --name drift-smoke nginx:alpine
          docker run -d --name drift-smoke-ptrace --cap-add SYS_PTRACE nginx:alpine
          sleep 10
          runtime-baseline baseline --container drift-smoke --runtime docker --output /tmp/baseline.json
          runtime-baseline verify --container drift-smoke --baseline /tmp/baseline.json --runtime docker
          echo "--- cross-container verify (expect CRITICAL capabilities) ---"
          runtime-baseline verify --container drift-smoke-ptrace --baseline /tmp/baseline.json --runtime docker || true
      - name: Admission review on fixtures
        run: |
          admission-review --pod tests/escape-test-pod.yaml --json > /tmp/escape.json
          admission-review --pod tests/secure-test-pod.yaml --json > /tmp/secure.json
          python3 -c "
          import json
          e = json.load(open('/tmp/escape.json')); s = json.load(open('/tmp/secure.json'))
          assert e['risk_level'] == 'CRITICAL', e['risk_level']
          assert s['risk_level'] != 'CRITICAL', s['risk_level']
          print('admission review live-path OK')
          "
