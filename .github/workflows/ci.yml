name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install .[dev]
      - name: Unit tests
        run: python -m pytest tests/ -v
      - name: Corpus consistency
        run: escape-corpus validate
      - name: Schemas parse
        run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('schemas/*.schema.json')]; print('schemas OK')"
      - name: CLI smoke test
        run: |
          escape-corpus --version
          escape-corpus techniques --id CE-001 | head -3
          escape-corpus rules --technique CE-007 | head -3
          escape-corpus schemas
